analyze_now:
  name: Analyze now
  description: Triggers an immediate log analysis via Mistral AI.

apply_fix:
  name: Apply a fix
  description: Applies an automatic fix for a specific issue (service calls or YAML modifications).
  fields:
    fix_script:
      name: Fix script
      description: JSON array of Home Assistant service calls or YAML edits to execute.
      required: true
      selector:
        text:
    issue_id:
      name: Issue ID
      description: Optional ID of the issue being fixed.
      required: false
      selector:
        text:

ignore_issue:
  name: Ignore an issue
  description: Marks an issue as ignored so it won't appear in future analyses.
  fields:
    issue_id:
      name: Issue ID
      description: The unique identifier of the issue to ignore.
      required: true
      selector:
        text:

unignore_issue:
  name: Unignore an issue
  description: Removes an issue from the ignored list.
  fields:
    issue_id:
      name: Issue ID
      description: The unique identifier of the issue to restore.
      required: true
      selector:
        text:

apply_all_fixes:
  name: Apply all fixes
  description: Creates a backup then applies all available automatic fixes sequentially.

generate_automation:
  name: Generate automation
  description: Generates a complete Home Assistant automation YAML using Mistral AI from natural language.
  fields:
    prompt:
      name: Description
      description: What you want the automation to do in natural language.
      required: true
      selector:
        text:
          multiline: true

save_automation:
  name: Save automation
  description: Appends a generated automation into automations.yaml and reloads automations.
  fields:
    yaml:
      name: Automation YAML
      description: The YAML content of the automation to add.
      required: true
      selector:
        text:
          multiline: true

