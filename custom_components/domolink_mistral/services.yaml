analyze_now:
  name: Analyze now
  description: Triggers an immediate log analysis via Mistral AI.

apply_fix:
  name: Apply a fix
  description: Applies an automatic fix for a specific issue (service calls or YAML modifications).
  fields:
    fix_script:
      name: Fix script
      description: JSON array of Home Assistant service calls or YAML edits to execute.
      required: true
      selector:
        text:
    issue_id:
      name: Issue ID
      description: Optional ID of the issue being fixed.
      required: false
      selector:
        text:

ignore_issue:
  name: Ignore an issue
  description: Marks an issue as ignored so it won't appear in future analyses.
  fields:
    issue_id:
      name: Issue ID
      description: The unique identifier of the issue to ignore.
      required: true
      selector:
        text:

unignore_issue:
  name: Unignore an issue
  description: Removes an issue from the ignored list.
  fields:
    issue_id:
      name: Issue ID
      description: The unique identifier of the issue to restore.
      required: true
      selector:
        text:

apply_all_fixes:
  name: Apply all fixes
  description: Creates a backup then applies all available automatic fixes sequentially.

generate_automation:
  name: Generate automation
  description: Generates a complete Home Assistant automation YAML using Mistral AI from natural language.
  fields:
    prompt:
      name: Description
      description: What you want the automation to do in natural language.
      required: true
      selector:
        text:
          multiline: true

save_automation:
  name: Save automation
  description: Appends a generated automation into automations.yaml and reloads automations.
  fields:
    yaml:
      name: Automation YAML
      description: The YAML content of the automation to add.
      required: true
      selector:
        text:
          multiline: true

analyze_image:
  name: Analyze image (Pixtral Vision)
  description: Analyzes a camera snapshot or local image file using Mistral Pixtral multimodal vision.
  fields:
    camera_entity_id:
      name: Camera entity
      description: The camera entity to take a snapshot from.
      required: false
      selector:
        entity:
          domain: camera
    image_path:
      name: Image file path
      description: Local path to an image file if not using a camera entity.
      required: false
      selector:
        text:
    prompt:
      name: Prompt / Question
      description: What to analyze or look for in the image.
      required: false
      selector:
        text:
          multiline: true
    model:
      name: Model
      description: Pixtral vision model to use.
      required: false
      default: pixtral-12b-2409
      selector:
        text:

generate_daily_briefing:
  name: Generate daily briefing
  description: Compiles household states (weather, lights, doors, batteries) into a warm, concise daily briefing.
  fields:
    time_of_day:
      name: Time of day
      description: Context of the briefing (morning, evening, or auto).
      required: false
      default: auto
      selector:
        select:
          options:
            - label: Automatique (selon l'heure)
              value: auto
            - label: Matin
              value: morning
            - label: Soir
              value: evening
    custom_instruction:
      name: Custom instruction
      description: Optional special instruction (e.g. Include a quote).
      required: false
      selector:
        text:


